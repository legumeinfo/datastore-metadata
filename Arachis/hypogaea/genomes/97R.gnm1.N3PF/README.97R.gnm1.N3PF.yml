description: "Genome assembly contributed by Josh Clevenger's group(Ethan Thompson), Hudsonalpha. \n\
Genotype description: \n\
SunOleic 97R(97R) is a landmark high-oleic runner market-type peanut variety released in 1996 by the University of Florida. It serves as a foundational genetic parent in global peanut breeding, particularly valued for its oil chemistry and use in disease-resistance mapping populations. SunOleic 97R is also utilized as a key founder parent in advanced multi-parent crosses like PeanutMAGIC to improve overall genetic diversity in cultivated peanuts (https://doi.org/10.1002/csc2.21402)."

