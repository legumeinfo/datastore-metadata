description: "Genome assembly contributed by Josh Clevenger's group(Ethan Thompson), Hudsonalpha. \n\
Genotype description: \n\
GP-NC WS16 (often called WS16) is a specialized peanut genetic line derived from an interspecific hybrid containing wild chromosomal segments from Arachis cardenasii. It is valued for disease resistance traits and its unique oleic acid genetics. It has unique alleles introgressed from the diploid wild species. The line is also unique in that it exhibits multiple disease resistances superior to the germplasm lines derived from A. cardenasii that were released previously by NCSU. Resistance to multiple diseases included early leaf spot (ELS), Cylindrocladium black rot (CBR), Sclerotinia blight (SB), and tomato spotted wilt (TSW). It also served as a founder parent in the advanced peanut genetic mapping population, PeanutMAGIC(https://doi.org/10.1002/csc2.21402)."

