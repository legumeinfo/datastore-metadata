description: "Genome assembly contributed by Josh Clevenger's group(Ethan Thompson), Hudsonalpha. \n\
Genotype description: \n\
Georgia-13M (or 13M) is a high-oleic, runner-type peanut cultivar released in 2014. Developed from a cross between 'Georgia-02C' and 'Georgia-09B', it is recognized for high disease resistance and serves as a founder parent in advanced peanut genetic mapping populations like PeanutMAGIC(https://doi.org/10.1002/csc2.21402)."

