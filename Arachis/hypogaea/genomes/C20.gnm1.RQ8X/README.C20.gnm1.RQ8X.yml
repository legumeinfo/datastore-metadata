description: "Genome assembly contributed by Josh Clevenger's group(Ethan Thompson), Hudsonalpha. \n\
Genotype description: \n\
The GT-C20(C20) peanut genetic line, commonly referenced as GT-C20, is a non-dormant Spanish-type peanut genotype widely utilized in peanut research for studying disease resistance, seed traits, and gene editing. It exhibits strong resistance to Aspergillus species colonization and reduced susceptibility to secondary aflatoxin contamination. It has been utilized as a founder parent in advanced peanut genetic mapping populations like PeanutMAGIC(https://doi.org/10.1002/csc2.21402)."

